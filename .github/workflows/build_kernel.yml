name: Build & Package Azeo Kernel

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force rebuild even if tag exists for today"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  upstream:
    name: 1. Check Upstream & Sync
    runs-on: ubuntu-latest
    outputs:
      skip_build: ${{ steps.check_state.outputs.skip_build }}
      kernel_version: ${{ steps.check_state.outputs.kernel_version }}
      zip_name: ${{ steps.check_state.outputs.zip_name }}
      build_time: ${{ steps.check_state.outputs.build_time }}
      upstream_sha: ${{ steps.check_state.outputs.upstream_sha }}
      tree_sha: ${{ steps.check_state.outputs.tree_sha }}
      full_sha: ${{ steps.check_state.outputs.full_sha }}

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Resolve Dynamic Version & Check Upstream State
        id: check_state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo rm -f /etc/localtime
          sudo ln -s /usr/share/zoneinfo/Asia/Jakarta /etc/localtime
          BUILD_TIME=$(TZ=Asia/Jakarta date '+%Y%m%d-%H%M')
          BUILD_DATE=$(TZ=Asia/Jakarta date '+%Y.%m.%d')

          UPSTREAM_SHA=$(curl -s "https://api.github.com/repos/manipvlator/los_kernel_xiaomi_sm6150/commits/stable" | jq -r '.sha // empty')
          if [ -z "$UPSTREAM_SHA" ]; then
            UPSTREAM_SHA="unknown"
          fi

          LATEST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n 1)
          if [ -z "$LATEST_TAG" ]; then
            BASE_MAJOR=1
            BASE_MINOR=0
            BASE_PATCH=0
          else
            CLEAN_TAG=$(echo "$LATEST_TAG" | sed 's/^v//' | cut -d'-' -f1)
            BASE_MAJOR=$(echo "$CLEAN_TAG" | cut -d'.' -f1)
            BASE_MINOR=$(echo "$CLEAN_TAG" | cut -d'.' -f2)
            BASE_PATCH=$(echo "$CLEAN_TAG" | cut -d'.' -f3)
          fi

          LAST_SHA=""
          if [ -f ".last_upstream_sha" ]; then
            LAST_SHA=$(cat .last_upstream_sha)
          fi

          if [ -n "$LAST_SHA" ] && [ "$LAST_SHA" != "$UPSTREAM_SHA" ] && [ "$UPSTREAM_SHA" != "unknown" ]; then
            NEW_MINOR=$((BASE_MINOR + 1))
            NEW_PATCH=0
          else
            NEW_MINOR=$BASE_MINOR
            NEW_PATCH=$BASE_PATCH
          fi

          KERNEL_VERSION="v${BASE_MAJOR}.${NEW_MINOR}.${NEW_PATCH}-${BUILD_DATE}"
          ZIP_NAME="AzeoKernel-sweet-${KERNEL_VERSION}.zip"

          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${KERNEL_VERSION}")

          FORCE_BUILD="${{ github.event.inputs.force_build }}"

          if [ "$FORCE_BUILD" = "true" ]; then
            echo "Force build enabled. Proceeding."
            SKIP_BUILD="false"
          elif [ "$HTTP_STATUS" = "200" ]; then
            echo "Release ${KERNEL_VERSION} already published. Use force_build=true to overwrite."
            SKIP_BUILD="true"
          else
            echo "Proceeding with compilation for ${KERNEL_VERSION}."
            SKIP_BUILD="false"
          fi

          git submodule update --init --recursive --remote
          cd source-code
          git checkout stable
          git pull origin stable
          TREE_SHA=$(git rev-parse --short HEAD)
          FULL_SHA=$(git rev-parse HEAD)

          echo "skip_build=${SKIP_BUILD}" >> $GITHUB_OUTPUT
          echo "kernel_version=${KERNEL_VERSION}" >> $GITHUB_OUTPUT
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "upstream_sha=${UPSTREAM_SHA}" >> $GITHUB_OUTPUT
          echo "tree_sha=${TREE_SHA}" >> $GITHUB_OUTPUT
          echo "full_sha=${FULL_SHA}" >> $GITHUB_OUTPUT

  build:
    name: 2. Compile Kernel & Package
    needs: upstream
    if: needs.upstream.outputs.skip_build != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository with Submodules
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install Dependencies
        run: |
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            bc bison ca-certificates cpio curl flex git libc6-dev libssl-dev \
            make openssl python3 python-is-python3 libelf-dev \
            zlib1g-dev kmod libncurses5-dev lz4 aria2 tar jq wget zip

      - name: Setup ZyCromerZ Clang & GCC Toolchains
        run: |
          mkdir -p clang && cd clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/17.0.0-20230725-release/Clang-17.0.0-20230725.tar.gz
          tar -xzf Clang-17.0.0-20230725.tar.gz
          rm Clang-17.0.0-20230725.tar.gz
          cd ..

          git clone --depth=1 https://github.com/greenforce-project/gcc-arm64 -b main gcc64
          git clone --depth=1 https://github.com/greenforce-project/gcc-arm -b main gcc32

          echo "CLANG_PATH=$GITHUB_WORKSPACE/clang" >> $GITHUB_ENV
          echo "GCC64_PATH=$GITHUB_WORKSPACE/gcc64" >> $GITHUB_ENV
          echo "GCC32_PATH=$GITHUB_WORKSPACE/gcc32" >> $GITHUB_ENV

      - name: Sync Submodule & Setup KernelSU-Next
        run: |
          git submodule update --init --recursive --remote
          cd source-code
          git checkout stable
          git pull origin stable

          # Ingest KernelSU-Next syscall hook
          curl -LSs "https://raw.githubusercontent.com/manipvlator/KernelSU-Next/stable/kernel/setup.sh" | bash -s syscall

          # 1. Disable CONFIG_LOCALVERSION_AUTO to remove '-dirty' and git hash suffix
          # 2. Set CONFIG_LOCALVERSION to '-AzeoKernel' directly in defconfig
          sed -i 's/CONFIG_LOCALVERSION="-reforge"/CONFIG_LOCALVERSION="-AzeoKernel"/g' arch/arm64/configs/vendor/sweet_defconfig
          sed -i 's/CONFIG_LOCALVERSION_AUTO=y/CONFIG_LOCALVERSION_AUTO=n/g' arch/arm64/configs/vendor/sweet_defconfig

      - name: Build Kernel Image
        run: |
          cd source-code
          export ARCH=arm64
          export PATH="$CLANG_PATH/bin:$GCC64_PATH/bin:$GCC32_PATH/bin:$PATH"
          export KBUILD_BUILD_USER="Azeo"
          export KBUILD_BUILD_HOST="AzeoLab"
          export KBUILD_COMPILER_STRING="$CLANG_PATH/bin/clang"

          make O=out ARCH=arm64 vendor/sweet_defconfig

          # Ensure CONFIG_LOCALVERSION overrides are locked in .config
          scripts/config --file out/.config \
            --set-str CONFIG_LOCALVERSION "-AzeoKernel" \
            -d CONFIG_LOCALVERSION_AUTO \
            -e CONFIG_KSU \
            -e CONFIG_KSU_SUSFS \
            -e CONFIG_KSU_SUSFS_SUS_PATH \
            -e CONFIG_KSU_SUSFS_SUS_MOUNT \
            -e CONFIG_KSU_SUSFS_SUS_KSTAT \
            -e CONFIG_KSU_SUSFS_TRY_UMOUNT \
            -e CONFIG_KSU_SUSFS_SPOOF_UNAME \
            -e CONFIG_KSU_SUSFS_ENABLE_LOG \
            -e CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
            -e CONFIG_KSU_SUSFS_OPEN_REDIRECT \
            -e CONFIG_KSU_SUSFS_SUS_MAP

          make O=out ARCH=arm64 olddefconfig

          make -j$(nproc --all) O=out ARCH=arm64 \
            LLVM=1 \
            LLVM_IAS=1 \
            CC=clang \
            CLANG_TRIPLE=$CLANG_PATH/aarch64-linux-gnu- \
            CROSS_COMPILE=$GCC64_PATH/bin/aarch64-elf- \
            CROSS_COMPILE_ARM32=$GCC32_PATH/bin/arm-eabi-

      - name: Package Flashable Zip with AnyKernel3
        env:
          ZIP_NAME: ${{ needs.upstream.outputs.zip_name }}
        run: |
          git clone --depth=1 https://github.com/manipvlator/Anykernel3.git -b reforge AnyKernel3

          # Customise AnyKernel3 Banner Text
          cat << 'EOF' > AnyKernel3/banner
          Azeo Kernel: boot sequence start...
          Redmi Note 10 Pro / Pro Max (sweet)
          Built by Azeo
          EOF

          # Customise AnyKernel3 Configuration
          sed -i 's/kernel.string=.*/kernel.string=Azeo Kernel for Redmi Note 10 Pro (sweet)/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name1=.*/device.name1=sweet/g' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=sweetin/g' AnyKernel3/anykernel.sh

          cp source-code/out/arch/arm64/boot/Image.gz AnyKernel3/Image.gz
          cp source-code/out/arch/arm64/boot/dtbo.img AnyKernel3/dtbo.img 2>/dev/null || true
          cp source-code/out/arch/arm64/boot/dtb.img AnyKernel3/dtb.img 2>/dev/null || true

          cd AnyKernel3
          zip -r "../${ZIP_NAME}" * -x .git README.md *placeholder
          cd ..

          SHA256_VAL=$(sha256sum "${ZIP_NAME}" | awk '{print $1}')
          echo "${SHA256_VAL}  ${ZIP_NAME}" > "${ZIP_NAME}.sha256"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.upstream.outputs.zip_name }}
          path: |
            ${{ needs.upstream.outputs.zip_name }}
            ${{ needs.upstream.outputs.zip_name }}.sha256

  release:
    name: 3. Create Release & Sync State
    needs: [upstream, build]
    if: needs.upstream.outputs.skip_build != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.upstream.outputs.zip_name }}

      - name: Generate Release Notes
        env:
          KERNEL_VERSION: ${{ needs.upstream.outputs.kernel_version }}
          BUILD_TIME: ${{ needs.upstream.outputs.build_time }}
          TREE_SHA: ${{ needs.upstream.outputs.tree_sha }}
          ZIP_NAME: ${{ needs.upstream.outputs.zip_name }}
        run: |
          SHA256_VAL=$(cat "${ZIP_NAME}.sha256" | awk '{print $1}')
          cat << EOF > release_notes.md
          ### Azeo Kernel for Redmi Note 10 Pro / Pro Max (\`sweet\` / \`sweetin\`)

          Production build of Azeo Kernel for Xiaomi Redmi Note 10 Pro and Pro Max on AOSP-based custom ROMs.

          #### Build Specifications
          - Target SoC: Qualcomm Snapdragon 732G (SM6150 / \`sdmsteppe\`)
          - Kernel Version: \`${KERNEL_VERSION}\`
          - Build Time: \`${BUILD_TIME}\` (WIB)
          - Upstream Commit: \`manipvlator/los_kernel_xiaomi_sm6150@${TREE_SHA}\`
          - Compiler: ZyCromerZ Clang 17.0.0 (LLVM Integrated Assembler)
          - Cross Compilers: Greenforce GCC 64-bit (\`aarch64-elf-\`) and 32-bit (\`arm-eabi-\`)

          #### Integrated Components
          - In-Tree KernelSU-Next (Syscall backend mode)
          - SusFS v2.2.0 Non-GKI path/mount concealment and symbol hiding
          - Schedutil CPU energy-model tuning
          - Localversion locked to \`-AzeoKernel\` without \`-dirty\` suffix

          #### Flashing Instructions
          1. Download \`${ZIP_NAME}\` and verify with \`${ZIP_NAME}.sha256\`.
          2. Reboot to custom recovery (TWRP / OrangeFox / Lineage Recovery).
          3. Flash the zip directly without wiping partitions.
          4. Reboot to system.
          5. Install [KernelSU-Next Manager](https://github.com/rifsxd/KernelSU-Next/releases).

          #### Cryptographic Checksum
          \`\`\`text
          SHA-256: ${SHA256_VAL}
          \`\`\`
          EOF

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.upstream.outputs.kernel_version }}
          name: "Azeo Kernel — ${{ needs.upstream.outputs.kernel_version }}"
          body_path: release_notes.md
          files: |
            ${{ needs.upstream.outputs.zip_name }}
            ${{ needs.upstream.outputs.zip_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Persist Upstream Processed SHA State
        env:
          FULL_SHA: ${{ needs.upstream.outputs.full_sha }}
        run: |
          git submodule update --init --remote source-code || true
          echo "${FULL_SHA}" > .last_upstream_sha
          git config --global user.name "Azeo"
          git config --global user.email "azeolxc@gmail.com"
          git add .last_upstream_sha source-code
          git commit -m "chore(sync): update processed upstream commit SHA & submodule [skip ci]" || echo "No state changes to commit"
          git push origin main || echo "State push skipped"
